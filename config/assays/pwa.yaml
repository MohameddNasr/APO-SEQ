name: pwa
version: 1.0
description: >
  P{wa} amplicon assay configuration. Coordinates are relative to the
  configured P{wa}/ebony reference contig. This is the standard P{wa}
  configuration used for transposase-containing assays.

reference:
  name: GridION_pwa_scalloped_actual_copia_actual_flanks
  fasta: reference_files/pwa_reference.fa
  length: 37389
  chromosome: GridION_pwa_scalloped_actual_copia_actual_flanks

regions:
  - id: left_outside_break
    label: Left Outside Break
    start: 1
    end: 13530
    color: "#D9D9D9"

  - id: repair_interval
    label: Repair Interval
    start: 13531
    end: 22758
    color: "#E8F4EA"

  - id: right_outside_break
    label: Right Outside Break
    start: 22759
    end: 37389
    color: "#D9D9D9"

dsb:
  positions:
    - 13531
    - 22758

plotting:
  default_shaded_regions:
    - left_outside_break
    - right_outside_break
  show_dsb: true
  show_region_labels: true

features:
  - id: sd_left
    label: Sd
    start: 1
    end: 13530
    color: "#777777"
  - id: p5
    label: P 5 prime
    start: 13531
    end: 14000
    color: "#4E79A7"
  - id: w_plus
    label: w+
    start: 14001
    end: 22200
    color: "#E15759"
  - id: p3
    label: P 3 prime
    start: 22201
    end: 22758
    color: "#4E79A7"
  - id: sd_right
    label: Sd
    start: 22759
    end: 37389
    color: "#777777"

analysis:
  default_af_thresholds:
    - 0.95
  default_alt_count: 10
  deduplicate_positions: true

igv:
  enabled: true
  flank_size: 100
  selection:
    mode:
      - passing_mutations
      - recurrent
      - outside_expected_region
    minimum_af: 0.95
    minimum_alt_count: 10
    apobec_only: true
    maximum_snapshots: 500
  display:
    sort_alignments_by: base
    color_alignments_by: strand
    show_soft_clipped_bases: true
    show_center_line: true
